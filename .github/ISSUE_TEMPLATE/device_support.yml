name: Device compatibility report / Cihaz uyumluluk raporu
description: Tell us whether the app works on your laptop / Uygulamanın cihazınızda çalışıp çalışmadığını bildirin
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Laptop model / Dizüstü modeli
      placeholder: "HP Victus 15-fa1xxx"
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works? / Neler çalışıyor?
      options:
        - label: Temperatures / Sıcaklıklar
        - label: Fan RPM reading / Fan RPM okuma
        - label: Max / Manual fan mode / Maksimum / Manuel mod
        - label: Custom curve / Özel eğri
        - label: Power modes / Güç modları
  - type: textarea
    id: wmi
    attributes:
      label: hpqBIntM test output / hpqBIntM test çıktısı
      description: "Elevated PowerShell: Get-CimInstance -Namespace root\\wmi -ClassName hpqBIntM"
      render: shell
    validations:
      required: true
